<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SotM Tokyo Venue</title>
<link rel="stylesheet" href="/wp-content/plugins/leaflet-maps-marker/leaflet-dist/leaflet.css">
<style>
html,body{margin:0}
#map{width:500px;height:420px;max-width:100vw}
</style>
</head>
<body>
<div id="map"></div>

<script src="/wp-content/plugins/leaflet-maps-marker/leaflet-dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([35.661004, 139.677649], 18);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
}).addTo(map);

L.marker([35.661004, 139.677649])
  .addTo(map)
  .bindPopup(
    '<div style="text-align:center">' +
    '<img src="/wp-content/uploads/2012/03/12logo.png" ' +
    'alt="State of the Map 2012" style="width:100px;height:auto"><br>' +
    '<b>State of the Map 2012</b><br>' +
    'The University of Tokyo<br>' +
    'Komaba Research Campus' +
    '</div>'
  )
  .openPopup();
</script>
</body>
</html>
