<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road to SotM Tokyo</title>
<link rel="stylesheet" href="/wp-content/plugins/leaflet-maps-marker/leaflet-dist/leaflet.css">
<style>
html,body{margin:0}
#map{width:500px;height:300px;max-width:100vw}
</style>
</head>
<body>
<div id="map"></div>

<script src="/wp-content/plugins/leaflet-maps-marker/leaflet-dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([35.66108, 139.6775], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
}).addTo(map);

const sotm = L.marker([35.66108, 139.6775]).addTo(map);
L.marker([35.676080, 139.676657]).addTo(map)
  .bindPopup('<b>SAKURA Hotel</b>');
L.marker([35.651900, 139.686369]).addTo(map)
  .bindPopup('<b>OLYMPIC INN</b>');

sotm.bindPopup(
  '<div style="text-align:center">' +
  '<img src="/maps/images/12logo.png" alt="State of the Map 2012" ' +
  'style="width:100px;height:auto"><br>' +
  '<b><a href="/">SotM Tokyo</a></b>' +
  '</div>'
).openPopup();
</script>
</body>
</html>
